<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Taylor Olsen-Vogt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #fafaf8;
      --paper-2: #f2f2ee;
      --ink: #0b0b0e;
      --soft: rgba(11, 11, 14, 0.62);
      --dim: rgba(11, 11, 14, 0.34);
      --line: rgba(11, 11, 14, 0.12);
      --line-strong: rgba(11, 11, 14, 0.24);
      --card: #ffffff;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 16%, rgba(0, 0, 0, 0.05), transparent 38%),
        radial-gradient(circle at 12% 86%, rgba(255, 255, 255, 0.92), transparent 44%),
        linear-gradient(145deg, var(--paper) 0%, var(--paper-2) 100%);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      padding: clamp(10px, 2vw, 18px);
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(2px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px clamp(16px, 2vw, 28px);
      border-bottom: 1px solid var(--line);
      gap: 16px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand {
      text-decoration: none;
      color: var(--ink);
      font-family: var(--serif);
      font-style: italic;
      font-size: 24px;
      letter-spacing: 0.02em;
      line-height: 0.9;
    }

    .profile-pic {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e8e4df;
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--dim);
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: background-color 220ms ease, transform 220ms ease;
      flex-shrink: 0;
    }

    .profile-pic:hover {
      background: #dcd5cf;
      transform: scale(1.08);
    }

    .contact-info {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-decoration: none;
      transition: color 160ms ease;
    }

    .contact-info a {
      color: inherit;
      text-decoration: none;
      transition: color 160ms ease;
    }

    .contact-info a:hover {
      color: var(--soft);
    }

    .contact-line {
      display: block;
    }

    .nav {
      display: flex;
      gap: clamp(14px, 2vw, 24px);
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 9px;
      color: var(--soft);
      transition: color 160ms ease;
    }

    .nav a:hover,
    .nav a.active { color: var(--ink); }

    .content {
      padding: clamp(32px, 5vw, 52px) clamp(24px, 4vw, 52px);
    }

    .page-title {
      font-family: var(--serif);
      font-size: clamp(48px, 7vw, 80px);
      line-height: 0.88;
      font-weight: 400;
      margin-bottom: 32px;
      color: var(--ink);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input,
    textarea {
      width: 100%;
      max-width: 540px;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.8);
      font-family: var(--sans);
      font-size: 14px;
      color: var(--ink);
      transition: border-color 220ms ease, background-color 220ms ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--ink);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
      font-weight: 300;
    }

    .form-submit {
      background: var(--ink);
      color: #f6f6f3;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 500;
      cursor: pointer;
      padding: 14px 28px;
      border: none;
      transition: background-color 220ms ease;
      font-size: 11px;
    }

    .form-submit:hover {
      background: rgba(11, 11, 14, 0.85);
    }

    .form-submit:active {
      transform: translateY(1px);
    }

    .status-msg {
      font-size: 13px;
      color: var(--soft);
      margin-top: 16px;
      display: none;
    }

    .status-msg.show {
      display: block;
    }

    .status-msg.success {
      color: #2d5a2d;
    }

    .status-msg.error {
      color: #8b2e2e;
    }

    @media (max-width: 700px) {
      body { padding: 0; }
      .shell { border-left: 0; border-right: 0; }
      .topbar { flex-direction: column; align-items: flex-start; }
      input, textarea { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-header">
          <a href="#" class="profile-pic">[ Photo ]</a>
          <a href="index.html" class="brand">Taylor Olsen-Vogt</a>
        </div>
        <div class="contact-info">
          <a href="mailto:taylor.olsen@outlook.com" class="contact-line">taylor.olsen@outlook.com</a>
          <a href="tel:+15619710963" class="contact-line">561 971 0963</a>
        </div>
      </div>
      <nav class="nav" aria-label="Primary">
        <a href="serious.html">Work</a>
        <a href="#">About</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </header>

    <main class="content">
      <h1 class="page-title">Get in touch.</h1>

      <form id="contact-form" method="POST" action="https://formspree.io/f/mjgpeonp">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" name="phone">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>

        <button type="submit" class="form-submit">Send</button>
        <p class="status-msg" id="status-msg"></p>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById('contact-form');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', function(e) {
      // Formspree handles submission, just show a message after
      statusMsg.textContent = 'Sending...';
      statusMsg.classList.add('show');
    });
  </script>
</body>
</html>
