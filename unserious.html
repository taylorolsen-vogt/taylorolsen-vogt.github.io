<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unserious | Taylor Olsen-Vogt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0e0e0e;
      --white: #ffffff;
      --rule: #e8e8e8;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
    }

    /* Canvas fills viewport, sits behind everything */
    #c {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* ─── Nav (matches serious.html) ─────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.15rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--rule);
    }

    .nav-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--ink);
      border: 1px solid var(--ink);
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .nav-name:hover { background: #2b2b2b; border-color: #2b2b2b; }

    .nav-name:focus-visible,
    .g-close:focus-visible,
    .g-send:focus-visible,
    .g-prompt:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.1rem;
      list-style: none;
    }

    .nav-center a {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(14, 14, 14, 0.45);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.15s;
    }
    .nav-center a:hover { color: var(--ink); }
    .nav-center a.active { color: var(--ink); }

    .nav-right {
      display: flex;
    }

    .mode-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(14, 14, 14, 0.45);
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid transparent;
      transition: color 0.15s;
    }
    .mode-btn + .mode-btn { border-left: 1px solid var(--rule); }
    .mode-btn.active { color: var(--ink); border-color: var(--rule); }

    /* ─── Gideon drawer (identical to serious.html) ──────────────────── */
    .g-drawer {
      position: fixed;
      right: 0; bottom: 0;
      width: 360px;
      max-width: 100%;
      max-height: 70vh;
      background: var(--ink);
      color: var(--white);
      border-left: 1px solid rgba(255,255,255,0.1);
      border-top: 1px solid rgba(255,255,255,0.1);
      transform: translateY(102%);
      transition: transform 0.32s ease;
      z-index: 650;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.36);
    }
    .g-drawer.open { transform: translateY(0); }

    .g-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .g-title { font-family: 'Cormorant', serif; font-size: 1.35rem; font-weight: 300; }
    .g-close { border: none; background: none; color: rgba(255,255,255,0.7); font-size: 22px; cursor: pointer; }

    .g-msgs {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      overflow-y: auto;
      flex: 1;
    }
    .g-msg { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.82); }
    .g-msg.user { color: rgba(255,255,255,0.55); text-align: right; }

    .g-prompt-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.2rem; }
    .g-prompt {
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: rgba(255,255,255,0.78);
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .g-prompt:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.34); color: var(--white); }

    .g-typing { display: inline-flex; gap: 4px; align-items: center; min-height: 12px; }
    .g-typing span {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: gtyping 1.2s ease-in-out infinite;
    }
    .g-typing span:nth-child(2) { animation-delay: 0.2s; }
    .g-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes gtyping {
      0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
      40% { opacity: 0.95; transform: scale(1.35); }
    }

    .g-input-row { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
    .g-input {
      flex: 1; border: none; background: transparent;
      color: var(--white); font-family: 'DM Sans', sans-serif;
      font-size: 12px; padding: 0.8rem 0.9rem; outline: none;
    }
    .g-send {
      border: none; border-left: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: rgba(255,255,255,0.75);
      font-family: 'DM Sans', sans-serif; font-size: 12px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0 0.9rem; cursor: pointer;
    }
    .g-send:hover { background: rgba(255,255,255,0.12); color: var(--white); }
  </style>
</head>
<body>

  <canvas id="c"></canvas>

  <nav>
    <button class="nav-name" id="openGideon" type="button">Speak to Gideon</button>
    <ul class="nav-center">
      <li><a href="serious.html" class="active">Work</a></li>
      <li><a href="#">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a class="mode-btn" href="serious.html">Serious</a>
      <a class="mode-btn active" href="unserious.html">Unserious</a>
    </div>
  </nav>

  <div class="g-drawer" id="gDrawer" role="dialog" aria-modal="false" aria-label="Speak to Gideon">
    <div class="g-head">
      <div class="g-title">Gideon</div>
      <button class="g-close" id="gClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="g-msgs" id="gMsgs">
      <div class="g-msg">Hi. I'm Gideon. Ask me about projects, systems, or what to click next.</div>
      <div class="g-prompt-row" id="gPrompts">
        <button class="g-prompt" type="button" data-q="What should I click first?">Start Here</button>
        <button class="g-prompt" type="button" data-q="Tell me about Mach 1 and Mach 2.">Robotics</button>
        <button class="g-prompt" type="button" data-q="Show me software highlights.">Software</button>
      </div>
    </div>
    <div class="g-input-row">
      <input class="g-input" id="gInput" type="text" placeholder="Ask Gideon...">
      <button class="g-send" id="gSend" type="button">Send</button>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── Renderer ────────────────────────────────────────────────────────
    const canvas   = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // ── Scene + fog to soften the horizon ───────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8f8f6);
    scene.fog = new THREE.Fog(0xf8f8f6, 28, 60);

    // ── Camera — very low, looking across the plane ──────────────────────
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 1.1, 8);
    camera.lookAt(0, 0, -12);

    // ── Floor (plain white) ─────────────────────────────────────────────
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshBasicMaterial({ color: 0xf8f8f6 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // ── Grid — large, subdivided, very faint ─────────────────────────────
    // Two-level grid: small cells + larger accent divisions
    const gridSmall = new THREE.GridHelper(80, 120, 0xd4d4d0, 0xd4d4d0);
    gridSmall.position.y = 0.001;
    scene.add(gridSmall);

    const gridLarge = new THREE.GridHelper(80, 16, 0xbcbcb8, 0xbcbcb8);
    gridLarge.position.y = 0.002;
    scene.add(gridLarge);

    // ── Render (static — no animation needed) ───────────────────────────
    renderer.render(scene, camera);

    // ── Resize ───────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.render(scene, camera);
    });
  </script>

  <script>
    // ── Gideon drawer ────────────────────────────────────────────────────
    const gDrawer  = document.getElementById('gDrawer');
    const gOpenBtn = document.getElementById('openGideon');
    const gClose   = document.getElementById('gClose');
    const gInput   = document.getElementById('gInput');
    const gSend    = document.getElementById('gSend');
    const gMsgs    = document.getElementById('gMsgs');
    const gPrompts = document.getElementById('gPrompts');

    function openGideon()  { gDrawer.classList.add('open'); requestAnimationFrame(() => gInput.focus()); }
    function closeGideon() { gDrawer.classList.remove('open'); }

    function addGideonMessage(text, isUser = false) {
      const m = document.createElement('div');
      m.className = `g-msg${isUser ? ' user' : ''}`;
      m.textContent = text;
      gMsgs.appendChild(m);
      gMsgs.scrollTop = gMsgs.scrollHeight;
    }

    function sendToGideon() {
      const text = gInput.value.trim();
      if (!text) return;
      addGideonMessage(text, true);
      gInput.value = '';
      const typing = document.createElement('div');
      typing.className = 'g-msg';
      typing.innerHTML = '<div class="g-typing"><span></span><span></span><span></span></div>';
      gMsgs.appendChild(typing);
      gMsgs.scrollTop = gMsgs.scrollHeight;
      setTimeout(() => {
        typing.remove();
        addGideonMessage('Try FORGE, Mach 1, and The Archive first. If you want, ask me for a guided route by category.');
      }, 420);
    }

    gOpenBtn.addEventListener('click', openGideon);
    gClose.addEventListener('click', closeGideon);
    gSend.addEventListener('click', sendToGideon);
    gInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendToGideon(); });

    if (gPrompts) {
      gPrompts.querySelectorAll('.g-prompt').forEach((btn) => {
        btn.addEventListener('click', () => { gInput.value = btn.dataset.q || ''; sendToGideon(); });
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && gDrawer.classList.contains('open')) closeGideon();
    });
  </script>

</body>
</html>
