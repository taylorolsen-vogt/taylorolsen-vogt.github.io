<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unserious | Taylor Olsen-Vogt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #fbfbf8;
      --ink: #0a0a0c;
      --soft: rgba(10, 10, 12, 0.58);
      --line: rgba(10, 10, 12, 0.2);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(circle at 82% 18%, rgba(0, 0, 0, 0.06), transparent 34%),
        radial-gradient(circle at 16% 86%, rgba(255, 255, 255, 0.95), transparent 46%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      padding: clamp(28px, 5vw, 52px);
      text-align: center;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(50px, 8vw, 88px);
      line-height: 0.88;
      font-weight: 400;
      margin-bottom: 12px;
    }

    p {
      color: var(--soft);
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.45;
      max-width: 30ch;
      margin: 0 auto 30px;
    }

    .switch {
      display: inline-flex;
      border: 1px solid var(--line);
    }

    .switch a {
      text-decoration: none;
      color: var(--soft);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 10px;
      padding: 12px 20px;
    }

    .switch a + a { border-left: 1px solid var(--line); }

    .switch .on {
      background: var(--ink);
      color: #f6f6f3;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Unserious<br>Mode</h1>
    <p>This path is ready for your playful side. We can build this next with motion, experiments, and personality-heavy work.</p>
    <div class="switch" role="group" aria-label="Mode switch">
      <a href="serious.html">Serious</a>
      <a href="unserious.html" class="on">Unserious</a>
    </div>
  </main>
</body>
</html>
