<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unserious | Taylor Olsen-Vogt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0e0e0e;
      --white: #ffffff;
      --rule: #e8e8e8;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
    }

    /* Canvas fills viewport, sits behind everything */
    #c {
      position: fixed;
      inset: 0;
      display: block;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 2rem;
      transform: translateX(-50%);
      z-index: 120;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.25);
      pointer-events: none;
      white-space: nowrap;
    }

    /* ─── Nav (matches serious.html) ─────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.15rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--rule);
    }

    .nav-name {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--ink);
      border: 1px solid var(--ink);
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .nav-name:hover { background: #2b2b2b; border-color: #2b2b2b; }

    .nav-name:focus-visible,
    .g-close:focus-visible,
    .g-send:focus-visible,
    .g-prompt:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .nav-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2.1rem;
      list-style: none;
    }

    .nav-center a {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(14, 14, 14, 0.45);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.15s;
    }
    .nav-center a:hover { color: var(--ink); }
    .nav-center a.active { color: var(--ink); }

    .nav-right {
      display: flex;
    }

    .mode-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(14, 14, 14, 0.45);
      text-decoration: none;
      padding: 6px 10px;
      border: 1px solid transparent;
      transition: color 0.15s;
    }
    .mode-btn + .mode-btn { border-left: 1px solid var(--rule); }
    .mode-btn.active { color: var(--ink); border-color: var(--rule); }

    /* ─── Gideon drawer (identical to serious.html) ──────────────────── */
    .g-drawer {
      position: fixed;
      right: 0; bottom: 0;
      width: 360px;
      max-width: 100%;
      max-height: 70vh;
      background: var(--ink);
      color: var(--white);
      border-left: 1px solid rgba(255,255,255,0.1);
      border-top: 1px solid rgba(255,255,255,0.1);
      transform: translateY(102%);
      transition: transform 0.32s ease;
      z-index: 650;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.36);
    }
    .g-drawer.open { transform: translateY(0); }

    .g-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .g-title { font-family: 'Cormorant', serif; font-size: 1.35rem; font-weight: 300; }
    .g-close { border: none; background: none; color: rgba(255,255,255,0.7); font-size: 22px; cursor: pointer; }

    .g-msgs {
      padding: 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      overflow-y: auto;
      flex: 1;
    }
    .g-msg { font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.82); }
    .g-msg.user { color: rgba(255,255,255,0.55); text-align: right; }

    .g-prompt-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.2rem; }
    .g-prompt {
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: rgba(255,255,255,0.78);
      font-family: 'DM Sans', sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .g-prompt:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.34); color: var(--white); }

    .g-typing { display: inline-flex; gap: 4px; align-items: center; min-height: 12px; }
    .g-typing span {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: gtyping 1.2s ease-in-out infinite;
    }
    .g-typing span:nth-child(2) { animation-delay: 0.2s; }
    .g-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes gtyping {
      0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
      40% { opacity: 0.95; transform: scale(1.35); }
    }

    .g-input-row { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
    .g-input {
      flex: 1; border: none; background: transparent;
      color: var(--white); font-family: 'DM Sans', sans-serif;
      font-size: 12px; padding: 0.8rem 0.9rem; outline: none;
    }
    .g-send {
      border: none; border-left: 1px solid rgba(255,255,255,0.1);
      background: transparent; color: rgba(255,255,255,0.75);
      font-family: 'DM Sans', sans-serif; font-size: 12px;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0 0.9rem; cursor: pointer;
    }
    .g-send:hover { background: rgba(255,255,255,0.12); color: var(--white); }
  </style>
</head>
<body>

  <canvas id="c"></canvas>
  <div id="hint">Drag the paper · Orbit with right-click or two fingers</div>

  <nav>
    <button class="nav-name" id="openGideon" type="button">Speak to Gideon</button>
    <ul class="nav-center">
      <li><a href="serious.html" class="active">Work</a></li>
      <li><a href="#">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-right">
      <a class="mode-btn" href="serious.html">Serious</a>
      <a class="mode-btn active" href="unserious.html">Unserious</a>
    </div>
  </nav>

  <div class="g-drawer" id="gDrawer" role="dialog" aria-modal="false" aria-label="Speak to Gideon">
    <div class="g-head">
      <div class="g-title">Gideon</div>
      <button class="g-close" id="gClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="g-msgs" id="gMsgs">
      <div class="g-msg">Hi. I'm Gideon. Ask me about projects, systems, or what to click next.</div>
      <div class="g-prompt-row" id="gPrompts">
        <button class="g-prompt" type="button" data-q="What should I click first?">Start Here</button>
        <button class="g-prompt" type="button" data-q="Tell me about Mach 1 and Mach 2.">Robotics</button>
        <button class="g-prompt" type="button" data-q="Show me software highlights.">Software</button>
      </div>
    </div>
    <div class="g-input-row">
      <input class="g-input" id="gInput" type="text" placeholder="Ask Gideon...">
      <button class="g-send" id="gSend" type="button">Send</button>
    </div>
  </div>

  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Scene ───────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f4ef);
    scene.fog = new THREE.Fog(0xf5f4ef, 20, 40);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 3.2, 7.5);
    camera.lookAt(0, 0, 0);

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    // ── Lights ──────────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff8f0, 2.5);
    sun.position.set(4, 8, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.1;
    sun.shadow.camera.far = 30;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.radius = 3;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xe8f0ff, 0.6);
    fill.position.set(-3, 4, -2);
    scene.add(fill);

    // ── Grid plane + shadow receiver ───────────────────────────────────
    const gridHelper = new THREE.GridHelper(30, 60, 0x999990, 0xb8b5ae);
    gridHelper.material.opacity = 0.8;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    const groundGeo = new THREE.PlaneGeometry(30, 30);
    const groundMat = new THREE.ShadowMaterial({ opacity: 0.08 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ── Orbit controls (scene orbit) ───────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 1;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI / 2.1;

    function hash(n) { return ((Math.sin(n) * 43758.5453) % 1 + 1) % 1; }

    function noise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3 - 2 * fx);
      const uy = fy * fy * (3 - 2 * fy);
      const a = hash(ix + iy * 57.1);
      const b = hash(ix + 1 + iy * 57.1);
      const c = hash(ix + (iy + 1) * 57.1);
      const d = hash(ix + 1 + (iy + 1) * 57.1);
      return a + (b - a) * ux + (c - a) * uy + (d - b + a - c) * ux * uy;
    }

    function fbm(x, y, oct = 5) {
      let v = 0, a = 0.5, f = 1, m = 0;
      for (let i = 0; i < oct; i++) {
        v += noise2(x * f, y * f) * a;
        m += a;
        a *= 0.5;
        f *= 2.1;
      }
      return v / m;
    }

    function makePaper(opts = {}) {
      const {
        size = 1.4,
        segments = 56,
        crumple = 0.16,
        seed = 3.7,
        px = 0, py = 0.01, pz = 0,
        rotY = 0,
      } = opts;

      const geo = new THREE.PlaneGeometry(size, size, segments, segments);
      geo.rotateX(-Math.PI / 2);

      const pos = geo.attributes.position;
      const uv = geo.attributes.uv;

      for (let i = 0; i < pos.count; i++) {
        const u = uv.getX(i), v = uv.getY(i);
        const cu = u - 0.5, cv = v - 0.5;
        const dist = Math.sqrt(cu * cu + cv * cv);
        const edge = 0.55 + dist * 0.9;

        const coarse = (fbm(u * 2.2 + seed, v * 2.2 + seed, 3) - 0.5);
        const fine = (fbm(u * 9 + seed * 1.7, v * 9 + seed * 1.7, 4) - 0.5);
        const disp = (coarse * 0.65 + fine * 0.35) * crumple * edge;

        pos.setY(i, pos.getY(i) + disp);
      }

      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.88,
        metalness: 0.0,
        side: THREE.DoubleSide,
      });

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.position.set(px, py, pz);
      mesh.rotation.y = rotY;
      scene.add(mesh);

      const rc = new THREE.Raycaster();
      const mp = new THREE.Vector2();
      const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -py);
      const hit3 = new THREE.Vector3();
      const off3 = new THREE.Vector3();

      let dragging = false;
      let hovered = false;
      let floatT = Math.random() * Math.PI * 2;

      function ndc(e) {
        mp.x = (e.clientX / window.innerWidth) * 2 - 1;
        mp.y = -(e.clientY / window.innerHeight) * 2 + 1;
      }

      function hitsMe(e) {
        ndc(e);
        rc.setFromCamera(mp, camera);
        const hits = rc.intersectObject(mesh);
        return hits.length ? hits[0] : null;
      }

      function onDown(e) {
        const h = hitsMe(e);
        if (!h) return;
        e.stopPropagation();
        dragging = true;
        controls.enabled = false;
        dragPlane.constant = -mesh.position.y;
        rc.ray.intersectPlane(dragPlane, hit3);
        off3.copy(hit3).sub(mesh.position);
        renderer.domElement.style.cursor = 'grabbing';
      }

      function onMove(e) {
        ndc(e);
        rc.setFromCamera(mp, camera);
        if (dragging) {
          e.stopPropagation();
          dragPlane.constant = -mesh.position.y;
          if (rc.ray.intersectPlane(dragPlane, hit3)) {
            const tx = hit3.x - off3.x;
            const tz = hit3.z - off3.z;
            mesh.position.x += (tx - mesh.position.x) * 0.3;
            mesh.position.z += (tz - mesh.position.z) * 0.3;
          }
        } else {
          const wasH = hovered;
          hovered = rc.intersectObject(mesh).length > 0;
          if (hovered !== wasH) {
            renderer.domElement.style.cursor = hovered ? 'grab' : '';
          }
        }
      }

      function onUp(e) {
        if (!dragging) return;
        e.stopPropagation();
        dragging = false;
        controls.enabled = true;
        renderer.domElement.style.cursor = hovered ? 'grab' : '';
      }

      renderer.domElement.addEventListener('pointerdown', onDown, true);
      window.addEventListener('pointermove', onMove, true);
      window.addEventListener('pointerup', onUp, true);

      function tick(dt) {
        floatT += dt * 0.5;
        if (!dragging) {
          mesh.position.y = py + Math.sin(floatT) * 0.005;
        }
      }

      return { tick };
    }

    const papers = [
      makePaper({ size: 1.4, segments: 56, crumple: 0.16, seed: 3.7, px: 0, py: 0.05, pz: 0, rotY: 0.3 }),
      makePaper({ size: 1.1, segments: 48, crumple: 0.14, seed: 8.2, px: -2.3, py: 0.04, pz: 1.1, rotY: -0.6 }),
      makePaper({ size: 1.25, segments: 50, crumple: 0.18, seed: 14.5, px: 1.8, py: 0.04, pz: -0.7, rotY: 1.9 }),
      makePaper({ size: 0.95, segments: 44, crumple: 0.12, seed: 21.1, px: -0.6, py: 0.04, pz: -2.0, rotY: 0.85 }),
    ];

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      papers.forEach(p => p.tick(dt));
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ── Resize ───────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

  <script>
    // ── Gideon drawer ────────────────────────────────────────────────────
    const gDrawer  = document.getElementById('gDrawer');
    const gOpenBtn = document.getElementById('openGideon');
    const gClose   = document.getElementById('gClose');
    const gInput   = document.getElementById('gInput');
    const gSend    = document.getElementById('gSend');
    const gMsgs    = document.getElementById('gMsgs');
    const gPrompts = document.getElementById('gPrompts');

    function openGideon()  { gDrawer.classList.add('open'); requestAnimationFrame(() => gInput.focus()); }
    function closeGideon() { gDrawer.classList.remove('open'); }

    function addGideonMessage(text, isUser = false) {
      const m = document.createElement('div');
      m.className = `g-msg${isUser ? ' user' : ''}`;
      m.textContent = text;
      gMsgs.appendChild(m);
      gMsgs.scrollTop = gMsgs.scrollHeight;
    }

    function sendToGideon() {
      const text = gInput.value.trim();
      if (!text) return;
      addGideonMessage(text, true);
      gInput.value = '';
      const typing = document.createElement('div');
      typing.className = 'g-msg';
      typing.innerHTML = '<div class="g-typing"><span></span><span></span><span></span></div>';
      gMsgs.appendChild(typing);
      gMsgs.scrollTop = gMsgs.scrollHeight;
      setTimeout(() => {
        typing.remove();
        addGideonMessage('Try FORGE, Mach 1, and The Archive first. If you want, ask me for a guided route by category.');
      }, 420);
    }

    gOpenBtn.addEventListener('click', openGideon);
    gClose.addEventListener('click', closeGideon);
    gSend.addEventListener('click', sendToGideon);
    gInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendToGideon(); });

    if (gPrompts) {
      gPrompts.querySelectorAll('.g-prompt').forEach((btn) => {
        btn.addEventListener('click', () => { gInput.value = btn.dataset.q || ''; sendToGideon(); });
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && gDrawer.classList.contains('open')) closeGideon();
    });
  </script>

</body>
</html>
