<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taylor Olsen-Vogt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #fbfbf8;
      --paper-2: #f1f1ed;
      --ink: #0a0a0c;
      --ink-soft: rgba(10, 10, 12, 0.62);
      --ink-dim: rgba(10, 10, 12, 0.34);
      --line: rgba(10, 10, 12, 0.42);
      --line-hover: rgba(10, 10, 12, 0.82);
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
    }

    body {
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 14% 12%, rgba(255, 255, 255, 0.98), transparent 40%),
        radial-gradient(circle at 88% 84%, rgba(0, 0, 0, 0.08), transparent 40%),
        linear-gradient(154deg, var(--paper) 0%, var(--paper-2) 58%, #ecece7 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.16;
      background-image: radial-gradient(rgba(0, 0, 0, 0.07) 0.45px, transparent 0.45px);
      background-size: 3px 3px;
      mix-blend-mode: multiply;
    }

    #intro-fade {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      opacity: 1;
      pointer-events: none;
      animation: quickFadeToWhite 480ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes quickFadeToWhite {
      0% {
        background: #000;
        opacity: 1;
      }
      72% {
        background: #fff;
        opacity: 1;
      }
      100% {
        background: #fff;
        opacity: 0;
      }
    }

    .stage {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(28px, 5vw, 56px);
    }

    .hero {
      width: min(780px, 100%);
      display: grid;
      gap: clamp(36px, 7vh, 68px);
      animation: riseIn 900ms cubic-bezier(0.22, 1, 0.36, 1) 140ms both;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .name-block {
      text-align: center;
    }

    .name {
      font-family: var(--serif);
      font-size: clamp(52px, 9vw, 88px);
      line-height: 0.92;
      letter-spacing: 0.01em;
      font-weight: 400;
      color: var(--ink);
    }

    .name em {
      font-style: italic;
      color: rgba(10, 10, 12, 0.48);
      font-weight: 300;
    }

    .descriptor {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--ink-soft);
      font-size: clamp(11px, 1.5vw, 14px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .dot {
      color: var(--ink-dim);
    }

    .pathways {
      width: min(420px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(2px);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.06);
    }

    .path-btn {
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-family: var(--sans);
      font-size: clamp(9px, 1vw, 11px);
      font-weight: 500;
      padding: 14px 10px;
      text-decoration: none;
      text-align: center;
      transition: color 220ms ease, background-color 220ms ease;
    }

    .path-btn:last-child {
      border-right: 0;
    }

    .path-btn:hover,
    .path-btn:focus-visible {
      color: #f7f7f4;
      background: #0a0a0c;
      outline: none;
    }

    .subcopy {
      text-align: center;
      color: var(--ink-dim);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      min-height: 1.2em;
    }

    @media (max-width: 640px) {
      .hero {
        gap: 40px;
      }

      .descriptor {
        gap: 8px;
        letter-spacing: 0.15em;
      }

      .pathways {
        width: min(340px, 100%);
      }

      .path-btn {
        padding: 12px 8px;
        letter-spacing: 0.14em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div id="intro-fade" aria-hidden="true"></div>

  <main class="stage">
    <section class="hero" aria-label="Landing page">
      <header class="name-block">
        <h1 class="name">Taylor <em>Olsen-Vogt</em></h1>
        <p class="descriptor" id="descriptor-line">
          <span>Software</span>
          <span class="dot">•</span>
          <span>Hardware</span>
          <span class="dot">•</span>
          <span>Marketing</span>
        </p>
      </header>

      <div class="pathways" role="group" aria-label="Choose a mode">
        <a class="path-btn" id="btn-serious" href="serious.html">Serious</a>
        <a class="path-btn" id="btn-unserious" href="unserious.html">Unserious</a>
      </div>
    </section>
  </main>
</body>
</html>
